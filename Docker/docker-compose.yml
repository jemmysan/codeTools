version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=projet
      - DB_USERNAME=root
      - DB_PASSWORD=

  db:
    image: mysql:5.7
    ports:
      - "3307:3306"  # Changer le port exposé sur l'hôte
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: projet
      MYSQL_USER: root
      MYSQL_PASSWORD: 
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
