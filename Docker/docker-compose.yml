services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      - DB_HOST=bsp-db-1
      - DB_PORT=3306
      - DB_DATABASE=db_bsp
      - DB_USERNAME=jemmy
      - DB_PASSWORD=bsp&jemmy&password

  db:
    image: mysql:8.4.0
    ports:
      - "3306:3306"  
    environment:
      MYSQL_ROOT_PASSWORD: "mysql&jemmy&password"
      MYSQL_USER: "jemmy"
      MYSQL_DATABASE: "db_bsp"
      MYSQL_PASSWORD: "bsp&jemmy&password"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:



