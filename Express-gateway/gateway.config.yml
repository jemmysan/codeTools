http:
  port: 8080
admin:
  port: 9876
  host: localhost
apiEndpoints:
  api:
    host: localhost
    paths: '/ip'
#------- EndPoints pour l'authentification ----------
  auth:
    host: localhost
    methods : 'GET,POST,PUT,PATCH,DELETE'
    paths: '/auth*'
serviceEndpoints:
  httpbin:
    url: 'https://httpbin.org'
  authService:
    url: 'http://localhost:5000'
policies:
  - basic-auth
  - cors
  - expression
  - key-auth
  - log
  - oauth2
  - proxy
  - rate-limit
pipelines:
  default:
    apiEndpoints:
      - api
    policies:
    # Uncomment `key-auth:` when instructed to in the Getting Started guide.
    # - key-auth:
      - proxy:
          - action:
              serviceEndpoint: httpbin 
              changeOrigin: true
#------- Pipeline pour l'authentification ----------
  auth:
    apiEndpoints:
      - auth
    policies:
      - log:
        - action:
            message: "${req.method} ${req.originalUrl}"
      - rate-limit:
        - action:
            max : 10
            windowMs : 120000
            rateLimitBy: "${req.ip}"
    # Uncomment `key-auth:` when instructed to in the Getting Started guide.
    # - key-auth:
#------- Proxy pour l'authentification ----------
      - proxy:
          - action:
              serviceEndpoint: authService 
              changeOrigin: true
