[project]
name = "project-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jemmysan", email = "jemmy1399@gmail.com" }
]
requires-python = ">=3.12.0"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.162.2",
    "motor>=3.7.1",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
project-manager = "project_manager:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
